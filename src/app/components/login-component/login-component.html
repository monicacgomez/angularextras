<div class="contenedor-login">

    <h1>Log In</h1>

    <form #formlogin="ngForm">

        <label>User name:</label>

        <input
            type="text"
            name="cajauser"
            #cajauser
            class="form-control"
        />

        <label>Password:</label>

        <input
            type="password"
            name="cajapassword"
            #cajapassword
            class="form-control"
        />

        <button
            type="button"
            class="btn btn-warning"
            (click)="logInEmpleado()">
            Log In
        </button>

    </form>

    <h2 *ngIf="mensaje" class="mensaje-login">
        {{mensaje}}
    </h2>

</div>
