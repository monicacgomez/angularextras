<h1>Subordinados</h1>
@if (empleados) {

    <div class="contenedor-tabla">

        <table class="table tabla-empleados">

            <thead>
                <tr>
                    <th>Id</th>
                    <th>Apellido</th>
                    <th>Oficio</th>
                    <th>Salario</th>
                    <th>Director</th>
                </tr>
            </thead>

            <tbody>

                @for (emp of empleados; track emp) {

                    <tr>
                        <td>{{emp.idEmpleado}}</td>
                        <td>{{emp.apellido}}</td>
                        <td>{{emp.oficio}}</td>
                        <td>{{emp.salario}}</td>
                        <td>{{emp.director}}</td>
                    </tr>

                }

            </tbody>

        </table>

    </div>

}
